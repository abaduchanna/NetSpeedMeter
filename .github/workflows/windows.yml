name: windows-build
on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # single source of truth: tags vX.Y.Z and main both build this version
  APP_VER: "3.0.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build NetSpeedMonitor.exe
        shell: cmd
        working-directory: src
        run: |
          rc /nologo icon.rc
          cl /nologo /O2 /W3 /DUNICODE /D_UNICODE main.c icon.res ^
            /Fe:NetSpeedMonitor.exe ^
            /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib advapi32.lib iphlpapi.lib ^
            comctl32.lib comdlg32.lib
          dir NetSpeedMonitor.exe

      - name: Smoke test (must stay alive 8s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "src\NetSpeedMonitor.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Host "process exited early with code $($p.ExitCode)"; exit 1 }
          Write-Host "smoke OK - process alive, killing"
          Stop-Process -Id $p.Id -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${env:APP_VER} installer.iss
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: NetSpeedMeter-v${{ env.APP_VER }}-x64
          path: |
            src/NetSpeedMonitor.exe
            dist/NetSpeedMeter-${{ env.APP_VER }}-x64-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NetSpeedMeter-v${{ env.APP_VER }}-x64
      - name: Create release + attach assets
        shell: bash
        run: |
          find . -name 'NetSpeedMonitor.exe' -exec mv {} NetSpeedMonitor-v${APP_VER}-x64.exe \;
          find . -name '*-Setup.exe' -exec mv {} NetSpeedMeter-${APP_VER}-x64-Setup.exe \;
          ls -la NetSpeedMonitor-v${APP_VER}-x64.exe NetSpeedMeter-${APP_VER}-x64-Setup.exe
          gh release create "${GITHUB_REF_NAME}" \
            --title "NetSpeedMonitor ${GITHUB_REF_NAME} - ORIGINAL 2.5.4.0 rebuild" \
            --notes "## Downloads

          - **NetSpeedMeter-${APP_VER}-x64-Setup.exe** - recommended installer (per-user, no admin, optional autostart)
          - **NetSpeedMonitor-v${APP_VER}-x64.exe** - portable single exe

          ## What is v${APP_VER}
          A faithful rebuild of the ORIGINAL NetSpeedMonitor 2.5.4.0, reverse-engineered from the official MSI payload (core_dll_601_x64):

          - **Original display**: 'Sent: 12.34 kB/s  Recv: 145.67 kB/s' - one row, taskbar-native colors, configurable Sent/Recv labels and order (layout.textsent / layout.textrecv / layout.changeorder).
          - **Original units and precision**: kB/s (1000), KiB/s (1024), MB/s, MiB/s + %.0f..%.3f precision - the exact unit strings and core.precision key of the original binary.
          - **Original menu**: Monitoring On/Off, Data Traffic, Reset Session, Traffic Import/Export Wizard, NetSpeedMonitor Website, Settings, Enable Toolbar Tooltip, Exit.
          - **Settings dialog** (the original configuration UI): interface picker, unit/precision, Sent/Recv texts, swap order, font, text color, tooltip, autostart.
          - **Data Traffic window**: Session / Today / Month / Total x Sent / Recv, 'System Uptime: %d Days %02d:%02d:%02d', daily history list, 14-day bar graph, CSV import/export, Clear Database. Daily log file instead of SQLite (same information, same path).
          - **Original registry schema**: core.monitoring, core.interface, core.bitrate, core.precision, layout.* under HKCU\\\\Software\\\\NetSpeedMonitor (v2.x values migrate automatically).
          - **Engine**: the original GetInterfaceInfo + per-adapter octet-delta system with the working counter layer (GetIfEntry2 first, legacy GetIfEntry fallback) - the counter fix that killed the 0.00 bug is kept, everything else is the 2.5.4.0 semantics.
          - **Taskbar hosting**: the original was a DeskBand COM object, which Windows 11 removed; this rebuild hosts the same text in the taskbar via the SetParent technique (works on Windows 10 and 11), with a floating topmost fallback." \
            NetSpeedMonitor-v${APP_VER}-x64.exe NetSpeedMeter-${APP_VER}-x64-Setup.exe || \
          gh release upload "${GITHUB_REF_NAME}" NetSpeedMonitor-v${APP_VER}-x64.exe NetSpeedMeter-${APP_VER}-x64-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
