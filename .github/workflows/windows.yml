name: windows-build
on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # 2.6.0 on tags v2.6.0, 2.6.0 on main too (single source of truth)
  APP_VER: "2.6.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build NetSpeedMonitor.exe
        shell: cmd
        working-directory: src
        run: |
          rc /nologo icon.rc
          cl /nologo /O2 /W3 /DUNICODE /D_UNICODE main.c icon.res ^
            /Fe:NetSpeedMonitor.exe ^
            /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib advapi32.lib iphlpapi.lib
          dir NetSpeedMonitor.exe

      - name: Smoke test (must stay alive 8s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "src\NetSpeedMonitor.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Host "process exited early with code $($p.ExitCode)"; exit 1 }
          Write-Host "smoke OK - process alive, killing"
          Stop-Process -Id $p.Id -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${env:APP_VER} installer.iss
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: NetSpeedMeter-v${{ env.APP_VER }}-x64
          path: |
            src/NetSpeedMonitor.exe
            dist/NetSpeedMeter-${{ env.APP_VER }}-x64-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NetSpeedMeter-v${{ env.APP_VER }}-x64
      - name: Create release + attach assets
        shell: bash
        run: |
          find . -name 'NetSpeedMonitor.exe' -exec mv {} NetSpeedMonitor-v${APP_VER}-x64.exe \;
          find . -name '*-Setup.exe' -exec mv {} NetSpeedMeter-${APP_VER}-x64-Setup.exe \;
          ls -la NetSpeedMonitor-v${APP_VER}-x64.exe NetSpeedMeter-${APP_VER}-x64-Setup.exe
          gh release create "${GITHUB_REF_NAME}" \
            --title "NetSpeedMeter ${GITHUB_REF_NAME} - ONE row + black background" \
            --notes "## Downloads

          - **NetSpeedMeter-${APP_VER}-x64-Setup.exe** - recommended installer (per-user, no admin, optional autostart)
          - **NetSpeedMonitor-v${APP_VER}-x64.exe** - portable single exe

          ## What's new in v2.6.0
          - **Original NetSpeedMonitor 2.5.4.0 measurement system, ported** - the speed engine is now the exact system reverse-engineered from the classic x64 MSI: GetInterfaceInfo enumeration + per-adapter GetIfEntry octet deltas (In/Out), summed over all IP interfaces, no status filter.
          - **Fixes the 0.00 speed bug** - the previous engine required the adapter to report OPERATIONAL, which the active Win10/11 adapter can skip, leaving the readout at 0.00 while traffic flowed. The original system has no such filter, so live traffic is always counted (upload included).
          - **Display unchanged** - one row, separate up/down readouts, both unit families (BYTES capital B / BITS lowercase b), pure black dark theme: exactly the v2.5.0 presentation.

          Right-click the tray icon (or the widget) for Units / Theme / Colored speeds / Floating mode / diagnostics." \
            NetSpeedMonitor-v${APP_VER}-x64.exe NetSpeedMeter-${APP_VER}-x64-Setup.exe || \
          gh release upload "${GITHUB_REF_NAME}" NetSpeedMonitor-v${APP_VER}-x64.exe NetSpeedMeter-${APP_VER}-x64-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
