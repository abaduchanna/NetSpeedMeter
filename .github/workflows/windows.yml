name: windows-build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build NetSpeedMonitor.exe
        shell: cmd
        working-directory: src
        run: |
          rc /nologo icon.rc
          cl /nologo /O2 /W3 /DUNICODE /D_UNICODE main.c icon.res ^
            /Fe:NetSpeedMonitor.exe ^
            /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib advapi32.lib iphlpapi.lib
          dir NetSpeedMonitor.exe

      - name: Smoke test (must stay alive 8s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "src\NetSpeedMonitor.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Host "process exited early with code $($p.ExitCode)"; exit 1 }
          Write-Host "smoke OK - process alive, killing"
          Stop-Process -Id $p.Id -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=2.1.1 installer.iss
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: NetSpeedMeter-v2.1.1-x64
          path: |
            src/NetSpeedMonitor.exe
            dist/NetSpeedMeter-2.1.1-x64-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NetSpeedMeter-v2.1.1-x64
      - name: Create release + attach assets
        shell: bash
        run: |
          find . -name 'NetSpeedMonitor.exe' -exec mv {} NetSpeedMonitor-v2.1.1-x64.exe \;
          find . -name '*-Setup.exe' -exec mv {} NetSpeedMeter-2.1.1-x64-Setup.exe \;
          ls -la NetSpeedMonitor-v2.1.1-x64.exe NetSpeedMeter-2.1.1-x64-Setup.exe
          gh release create "${GITHUB_REF_NAME}" \
            --title "NetSpeedMeter ${GITHUB_REF_NAME} - installer edition" \
            --notes "## Downloads

          - **NetSpeedMeter-${GITHUB_REF_NAME}-x64-Setup.exe** - recommended installer (per-user, no admin, optional autostart)
          - **NetSpeedMonitor-v2.1.1-x64.exe** - portable single exe

          v2.1.1 ships a proper setup installer; app features unchanged from v2.1.0 (Units Auto/KB/s/MB/s, Theme Auto/Dark/Light, colored speeds)." \
            NetSpeedMonitor-v2.1.1-x64.exe NetSpeedMeter-2.1.1-x64-Setup.exe || \
          gh release upload "${GITHUB_REF_NAME}" NetSpeedMonitor-v2.1.1-x64.exe NetSpeedMeter-2.1.1-x64-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
