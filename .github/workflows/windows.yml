name: windows-build
on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # single source of truth: tags vX.Y.Z and main both build this version
  APP_VER: "3.0.5"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build taskbar XAML bridge DLL (Windows 11 taskbar reservation)
        shell: cmd
        working-directory: src\taskbar_xaml
        run: |
          cl /nologo /std:c++20 /EHsc /MT /LD /O2 xaml_bridge.cpp ^
            /Foxaml_bridge.obj ^
            /link /Brepro /OUT:..\NetSpeedTaskbarXaml.dll /IMPLIB:NetSpeedTaskbarXaml.lib ^
            /DEF:xaml_bridge.def windowsapp.lib runtimeobject.lib user32.lib ole32.lib
          dir ..\NetSpeedTaskbarXaml.dll

      - name: Build NetSpeedMonitor.exe
        shell: cmd
        working-directory: src
        run: |
          rc /nologo icon.rc
          cl /nologo /O2 /W3 /DUNICODE /D_UNICODE main.c icon.res ^
            /Fe:NetSpeedMonitor.exe ^
            /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib advapi32.lib iphlpapi.lib ^
            comctl32.lib comdlg32.lib
          dir NetSpeedMonitor.exe

      - name: Smoke test (must stay alive 8s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "src\NetSpeedMonitor.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Host "process exited early with code $($p.ExitCode)"; exit 1 }
          Write-Host "smoke OK - process alive, killing"
          Stop-Process -Id $p.Id -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${env:APP_VER} installer.iss
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: NetSpeedMonitor-v${{ env.APP_VER }}-x64
          path: |
            src/NetSpeedMonitor.exe
            src/NetSpeedTaskbarXaml.dll
            dist/NetSpeedMonitor-${{ env.APP_VER }}-x64-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NetSpeedMonitor-v${{ env.APP_VER }}-x64
      - name: Create release + attach assets
        shell: bash
        run: |
          find . -name 'NetSpeedMonitor.exe' -exec mv {} NetSpeedMonitor.exe \;
          find . -name 'NetSpeedTaskbarXaml.dll' -exec mv {} NetSpeedTaskbarXaml.dll \;
          find . -name '*-Setup.exe' -exec mv {} NetSpeedMonitor-${APP_VER}-x64-Setup.exe \;
          # Portable mode is now 2 files (the exe plus its optional Windows 11
          # taskbar-reservation DLL) - zip them together as one download so
          # "portable" still means "one file to grab".
          zip -j NetSpeedMonitor-v${APP_VER}-x64-portable.zip NetSpeedMonitor.exe NetSpeedTaskbarXaml.dll
          ls -la NetSpeedMonitor-v${APP_VER}-x64-portable.zip NetSpeedMonitor-${APP_VER}-x64-Setup.exe
          gh release create "${GITHUB_REF_NAME}" \
            --title "NetSpeedMonitor ${GITHUB_REF_NAME}" \
            --notes "## Downloads

          - **NetSpeedMonitor-${APP_VER}-x64-Setup.exe** - per-user installer with optional autostart
          - **NetSpeedMonitor-v${APP_VER}-x64-portable.zip** - portable, no installer (unzip and run NetSpeedMonitor.exe; keep NetSpeedTaskbarXaml.dll next to it)

          Displays live Sent and Recv network speed in the Windows taskbar. It includes interface selection, configurable units and precision, traffic totals and daily history, CSV import/export, tooltip controls, autostart, and a floating fallback. On Windows 11, embedding now reserves real space in Explorer's own taskbar layout (NetSpeedTaskbarXaml.dll) instead of only reparenting into the compatibility HWND strip; Windows 10 and any Windows 11 case the bridge can't reach fall back to the proven SetParent technique automatically." \
            NetSpeedMonitor-v${APP_VER}-x64-portable.zip NetSpeedMonitor-${APP_VER}-x64-Setup.exe || \
          gh release upload "${GITHUB_REF_NAME}" NetSpeedMonitor-v${APP_VER}-x64-portable.zip NetSpeedMonitor-${APP_VER}-x64-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
